<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDL</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <script src="../js/app.js" type="module"></script>
</head>
<body>
    <header class="banner">
        <h1>TO DO LIST</h1>
        <div class="add-project">
            <button class="add-project-button"><img src="../img/plus.png" alt="plus" style="width: 25px; height: 25px;"></button>
            <h2>Add new project</h2>
        </div>
    </header>
    <hr style="color: aqua;">
        <div class="task">
            <textarea id="project-text-area" spellcheck="false" placeholder="Nommez le projet" style="width: 50%;"></textarea>
            <a href="project.html"></a>
            <h4 style="color: grey; align-self: center;">Statut: En cours</h4>
        </div>
    <template id="project-template">
            <div class="task">
                <textarea id="project-text-area" spellcheck="false" placeholder="Nommez le projet" style="width: 50%;"></textarea>
                <a href="project.html"></a>
                <h4 style="color: grey; align-self: center;">Statut: En cours</h4>
            </div>   
    </template>
</body>
</html>
